<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="theme-color"
    content="#17365D"
  >

  <meta
    name="description"
    content="Reporte de Atención de Reclamos"
  >

  <title>
    Reporte de Atención de Reclamos
  </title>


  <!-- =====================================================
       CONFIGURACIÓN DE GOOGLE APPS SCRIPT
       =====================================================

       IMPORTANTE:
       Debes colocar aquí la URL REAL de tu implementación
       de Google Apps Script.

       Debe terminar en:

       /exec

       NO debe terminar en:

       /dev
  ====================================================== -->

  <script>

    window.APP_CONFIG = {

      APPS_SCRIPT_URL:
        "https://script.google.com/macros/s/AKfycbx9cVF4DK2iVfHrFAwp4ikfVnL8OU4tJ_AjrzRj07QdhjnAyIldGGmcttJcavLLujBH/exec"

    };

  </script>


  <!-- =====================================================
       ESTILOS
  ====================================================== -->

  <link
    rel="stylesheet"
    href="styles.css?v=25"
  >


  <!-- =====================================================
       MANIFEST
  ====================================================== -->

  <link
    rel="manifest"
    href="manifest.json?v=25"
  >

</head>


<body>


  <!-- =====================================================
       ENCABEZADO
  ====================================================== -->

  <header class="app-header">

    <div>

      <h1>
        Reporte de Atención de Reclamos
      </h1>

      <div id="status">
        Listo para registrar un reclamo.
      </div>

    </div>

  </header>


  <!-- =====================================================
       CONTENIDO PRINCIPAL
  ====================================================== -->

  <main class="container">


    <!-- ===================================================
         DATOS GENERALES
    ==================================================== -->

    <section class="card">

      <h2>
        Datos generales
      </h2>


      <div class="grid">


        <label>

          N.° de reporte

          <input
            id="nReporte"
            type="text"
            placeholder="Ingrese número de reporte"
          >

        </label>


        <label>

          Fecha

          <input
            id="fecha"
            type="date"
          >

        </label>


        <label>

          Cliente

          <input
            id="cliente"
            type="text"
            placeholder="Nombre del cliente"
          >

        </label>


        <label>

          RRCL

          <input
            id="rrcl"
            type="text"
            placeholder="RRCL"
          >

        </label>


        <label>

          Fecha de recepción

          <input
            id="fechaRecepcion"
            type="date"
          >

        </label>


        <label>

          Fecha de atención

          <input
            id="fechaAtencion"
            type="date"
          >

        </label>


        <label>

          Factura

          <input
            id="factura"
            type="text"
            placeholder="N.° de factura"
          >

        </label>


        <label>

          Vendedor

          <input
            id="vendedor"
            type="text"
            placeholder="Nombre del vendedor"
          >

        </label>


      </div>


      <label>

        Descripción del reclamo

        <textarea
          id="descripcionReclamo"
          rows="4"
          placeholder="Describa el reclamo"
        ></textarea>

      </label>

    </section>


    <!-- ===================================================
         PRODUCTOS
    ==================================================== -->

    <section class="card">

      <div class="section-head">

        <h2>
          Productos involucrados
        </h2>

        <button
          id="addProduct"
          type="button"
          class="primary"
        >
          + Agregar producto
        </button>

      </div>


      <div class="table-wrap">

        <table
          id="productsTable"
          class="data-table"
        >

          <thead>

            <tr>

              <th>
                ÍTEM
              </th>

              <th>
                PRODUCTO
              </th>

              <th>
                LOTE
              </th>

              <th>
                FV
              </th>

              <th>
                CANTIDAD
              </th>

              <th>
                ACCIÓN
              </th>

            </tr>

          </thead>


          <tbody>
          </tbody>

        </table>

      </div>

    </section>


    <!-- ===================================================
         HALLAZGOS Y FOTOGRAFÍAS
    ==================================================== -->

    <section class="card">

      <h2>
        Hallazgos y evidencia fotográfica
      </h2>

      <div id="findings">
      </div>

    </section>


    <!-- ===================================================
         CIERRE DEL RECLAMO
    ==================================================== -->

    <section class="card">

      <h2>
        Cierre del reclamo
      </h2>


      <div class="grid">


        <label>

          Destino del producto

          <select id="destino">

            <option value="">
              Seleccione...
            </option>

            <option value="DEVOLUCIÓN">
              DEVOLUCIÓN
            </option>

            <option value="DESTRUCCIÓN">
              DESTRUCCIÓN
            </option>

            <option value="REPOSICIÓN">
              REPOSICIÓN
            </option>

            <option value="OTRO">
              OTRO
            </option>

          </select>

        </label>


        <label>

          Conclusión

          <input
            id="conclusion"
            type="text"
            readonly
          >

        </label>


      </div>


      <label>

        Acción correctiva

        <textarea
          id="accionCorrectiva"
          rows="4"
          placeholder="Describa la acción correctiva"
        ></textarea>

      </label>


      <div class="grid">


        <label>

          Preparado por

          <input
            id="preparadoPor"
            type="text"
            value="Ing. Katherine Correa Palacios"
          >

        </label>


        <label>

          Aprobado por

          <input
            id="aprobadoPor"
            type="text"
            value="Mblgo. Isaias Castillo B."
          >

        </label>


      </div>

    </section>


    <!-- ===================================================
         ACCIONES
    ==================================================== -->

    <section class="card actions-card">


      <button
        id="generate"
        type="button"
        class="primary big"
      >
        📄 GENERAR REPORTE
      </button>


      <div class="secondary-actions">


        <button
          id="saveDraft"
          type="button"
          class="secondary"
        >
          💾 Guardar borrador
        </button>


        <button
          id="loadDraft"
          type="button"
          class="secondary"
        >
          📂 Cargar borrador
        </button>


        <button
          id="clearDraft"
          type="button"
          class="danger"
        >
          🗑 Borrar borrador
        </button>


      </div>


    </section>


    <!-- ===================================================
         PROGRESO
    ==================================================== -->

    <section
      id="progress"
      class="progress hidden"
    >
      Preparando...
    </section>


    <!-- ===================================================
         RESULTADO
    ==================================================== -->

    <section
      id="result"
      class="result"
    >
    </section>


  </main>


  <!-- =====================================================
       PIE
  ====================================================== -->

  <footer>

    <small>
      Reporte de Atención de Reclamos
    </small>

  </footer>


  <!-- =====================================================
       JAVASCRIPT
       ======================================================

       IMPORTANTE:
       app.js se carga DESPUÉS de APP_CONFIG.
  ====================================================== -->

  <script src="app.js?v=25"></script>


  <!-- =====================================================
       SERVICE WORKER
  ====================================================== -->

  <script>

    if (
      "serviceWorker" in navigator
    ) {

      window.addEventListener(
        "load",
        () => {

          navigator.serviceWorker
            .register(
              "./service-worker.js?v=25"
            )
            .catch(
              error => {
                console.warn(
                  "Service Worker:",
                  error
                );
              }
            );

        }
      );

    }

  </script>


</body>

</html>
